name: Website verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-checks:
    name: Website smoke and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: python3 tests/smoke_test.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
